# ─────────────────────────────────────────────────────────────────────────────
# 编辑精选 Editor's picks
#
# match = 作品的 Devpost 链接 或 GitHub 仓库链接（用来和自动抓取到的作品对齐）
# 若自动抓取没有覆盖到该作品，curated 数据源会用这里的字段直接建档。
# zh       = 一句话中文简介（卡片上展示）
# note_zh  = 编辑点评：为什么值得看
# vibe     = 亮点标签，取值：humor 脑洞幽默 | warmth 情感温度 | hardcore 硬核工程 | practical 实用落地 | impact 社会价值
# facets   = 可选，手动指定分类，覆盖自动结果，如 { domain = ["health"], form = ["wearable"] }
# repo     = 可选，只用于不写 title 的条目：抓取页面没链接、但核实过属于该作品的代码仓库
# pick     = 可选，默认 true；写 false 表示只建档（自动抓取漏掉、核实过的作品），不进编辑精选
#
# 前 6 条来自 AlexDrives/hardware-hackathon-radar 的 docs/makemit-and-benchmarks.md
# ─────────────────────────────────────────────────────────────────────────────

