# ─────────────────────────────────────────────────────────────────────────────
# 分类体系 Taxonomy — 多维正交分面 (faceted, multi-label)
#
#   场景 domain       → 为谁/解决什么问题      (WHY)
#   形态 form         → 做出来是个什么东西      (WHAT)
#   交互 interaction  → 人怎么和它打交道        (HOW · HMI)
#   平台 platform     → 用了什么硬件平台        (WITH)
#   智能 ai           → 用了什么 AI 能力        (BRAIN)
#   工艺 fab          → 用了什么制造工艺        (BUILD)
#
# 每个 term:
#   kw   = 文本关键词（标题/标语权重 ×3，正文 ×1）；英文按词边界匹配（自动兼容复数），中文按子串匹配
#   tags = Devpost "Built With" / GitHub topics 精确匹配（权重 ×3）
#   某个 term 得分 ≥ facet.threshold 即打上该标签；每个 facet 最多保留 facet.max 个
# 修改本文件后运行 `python -m pipeline.run --reclassify` 即可全量重分（无需重新抓取）
# ─────────────────────────────────────────────────────────────────────────────

[hardware]
# 判定"是不是硬件作品"：得分 ≥ threshold 视为硬件项目（专门的硬件赛事全部收录，不受此限制）
