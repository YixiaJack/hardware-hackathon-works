# ─────────────────────────────────────────────────────────────────────────────
# 赛事系列 Competition series
#
# hardware_focus:
#   "dedicated" → 纯硬件/造物赛事：全部作品收录
#   "track"     → 综合黑客松（有硬件赛道）：只收录被判定为硬件的作品（见 taxonomy.toml [hardware]）
# kind: makeathon | hackathon | xr-hack | online-contest | prize | build-fest
#
# Devpost 版本自动发现：devpost_search 搜索词 + devpost_title_regex 标题过滤
#   → 新一届一上 Devpost 就会被下一次定时任务自动收录，无需改配置
# ─────────────────────────────────────────────────────────────────────────────

# 全 Devpost 硬件新作流：按时间倒序抓取（search.json 默认最新优先），
# 只保留 获奖 或 点赞 ≥ min_likes 的作品，并经硬件判定过滤
[devpost_stream]
queries = ["arduino", "raspberry pi", "esp32", "robot", "wearable", "3d printing", "jetson", "microcontroller", "servo", "pcb"]
pages = 6
min_likes = 3

# GitHub 额外检索式（系列专属检索式写在各 series 的 github_queries 里）
[[github_extra_queries]]
q = "topic:hardware-hackathon"

[[github_extra_queries]]
q = "makeathon in:name,description stars:>=1"


