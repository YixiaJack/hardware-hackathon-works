name: Check PR

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Re-classify existing data with the PR's taxonomy / picks (no network)
        run: python -m pipeline.run --reclassify
      - name: Validate
        run: python scripts/validate.py
      - name: Show classification diff summary
        run: git diff --stat
